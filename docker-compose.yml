services:
  douyin-parser:
    build: .
    image: douyin-parser:local
    container_name: douyin-parser
    ports:
      - "8000:8000"  # Media Extractor API
      - "8001:8001"  # User Parser API
    volumes:
      - type: bind
        source: ./douyin_cookies.json
        target: /app/douyin_cookies.json
        read_only: true
        bind:
          create_host_path: false
    environment:
      - TZ=Asia/Shanghai
    command: sh -c "uvicorn douyin_parser_api:app --host 0.0.0.0 --port 8000 & uvicorn douyin_user_parser_api:app --host 0.0.0.0 --port 8001 & wait"
    restart: unless-stopped
